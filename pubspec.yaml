name: oracle_card_app
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^16.2.1
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  get_it: ^8.2.0
  shared_preferences: ^2.5.3
  flutter_bloc: ^9.1.1
  logger: ^2.6.1
  fluttertoast: ^8.2.12
  freezed_annotation: ^3.1.0
  permission_handler: ^12.0.1
  flutter_secure_storage: ^9.2.4
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  flutter_dotenv: ^6.0.0
  retry: ^3.1.2
  flutter_svg: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

